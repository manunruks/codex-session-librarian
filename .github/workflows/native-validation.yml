name: Isolated native validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install fixed native CLIs and optional test decoders
        run: |
          npm install --prefix "$RUNNER_TEMP/csl-native" @openai/codex@0.166.0 @anthropic-ai/claude-code@2.1.308
          echo "$RUNNER_TEMP/csl-native/node_modules/.bin" >> "$GITHUB_PATH"
          python -m pip install -r media-test-requirements.txt
      - name: Execute synthetic native and migration checks without model generation
        env:
          CSL_RUN_CODEX_NATIVE_TESTS: '1'
          CSL_RUN_CLAUDE_NATIVE_TESTS: '1'
          CSL_RUN_MIGRATION_E2E_TESTS: '1'
          CSL_RUN_MEDIA_TESTS: '1'
          CSL_MEDIA_SANDBOX: required
        run: |
          lab=$(mktemp -d)
          env HOME="$lab" CODEX_HOME="$lab/codex" CLAUDE_CONFIG_DIR="$lab/claude" python -m unittest discover -s tests -v
